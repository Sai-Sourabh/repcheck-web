<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2B2B2E" />
    <meta name="description" content="RepCheck tracks your lifts and tells you if you are progressively overloading." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RepCheck</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      try {
        var theme = JSON.parse(localStorage.getItem('repcheck-prefs') || '{}').state?.theme
        if (theme && theme !== 'nocturne') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
